<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>卤蛋开场+欢迎主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family:"Microsoft YaHei",sans-serif;
}

/* 开场页 改成年轻渐变网红背景 */
#page1{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:absolute;
  top:0;
  left:0;
  z-index:10;
  /* 年轻梦幻紫蓝渐变 好看不土 */
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  transition: opacity 0.8s ease;
}
#page1.hide{
  opacity:0;
  pointer-events:none;
}

.title{
  font-size:clamp(26px,8vw,45px);
  color:#fff;
  margin-bottom:80px;
  text-shadow:0 0 12px rgba(255,255,255,0.3);
  text-align:center;
}
.wrap{
  display:flex;
  align-items:center;
  gap:25px;
}

.egg{
  width:120px;
  height:160px;
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background: linear-gradient(135deg,#f8f2e6 0%,#f0e6d2 40%,#e3d4bc 100%);
  box-shadow:
    inset -15px -15px 30px rgba(0,0,0,0.2),
    inset 12px 12px 25px rgba(255,255,255,0.7),
    0 20px 40px rgba(0,0,0,0.3);
  position:relative;
  cursor:pointer;
  transition:transform 0.2s ease;
}
.egg::after{
  content:"";
  position:absolute;
  width:40px;
  height:60px;
  background:rgba(255,255,255,0.55);
  border-radius:50%;
  top:25px;
  left:20px;
  transform:rotate(-20deg);
  filter:blur(6px);
}
.egg:active{
  transform:scale(0.95);
}
.tip-text{
  color:#fff;
  font-size:22px;
  letter-spacing:2px;
  text-shadow: 0 0 8px rgba(0,0,0,0.2);
}
.fragment{
  position:absolute;
  background:linear-gradient(135deg,#f8f2e6,#e3d4bc);
  border-radius:50%;
  opacity:0.95;
}

#page2{
  width:100vw;
  height:100vh;
  position:absolute;
  top:0;
  left:0;
  display:flex;
  justify-content:center;
  align-items:center;
  /* 后面欢迎页还是保留原来深色星空不变 */
  background:#080b1a;
}
#starBox{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
}
.welcome{
  position:relative;
  z-index:1;
  font-size:clamp(50px,20vw,110px);
  font-weight:bold;
  color:#ffffff;
  letter-spacing:6px;
  text-shadow:0 0 10px rgba(135,206,235,0.6),
              0 0 20px rgba(135,206,235,0.4),
              0 0 30px rgba(64,136,235,0.3);
  animation:softBreath 3.2s ease-in-out infinite alternate;
}

@keyframes softBreath {
  0% {opacity:0.8;transform:scale(0.96);}
  100% {opacity:1;transform:scale(1.04);}
}
@keyframes twinkle {
  0% {opacity:0.2;}
  100% {opacity:0.85;}
}
@keyframes heartScale {
  0% {transform:translateY(0) scale(0.2);opacity:1;}
  100% {transform:translateY(-150px) scale(1.8);opacity:0;}
}
</style>
</head>
<body>

<div id="page1">
  <div class="title">就tm你叫卤蛋是吧</div>
  <div class="wrap">
    <div class="egg" id="egg"></div>
    <div class="tip-text" id="tipTxt">点击敲碎</div>
  </div>
</div>

<div id="page2">
  <div id="starBox"></div>
  <div class="welcome">欢迎</div>
</div>

<script>
const starBox = document.getElementById('starBox');
const starCount = 180;
for(let i = 0; i < starCount; i++){
  let star = document.createElement('div');
  star.style.position = 'absolute';
  star.style.background = '#fff';
  star.style.borderRadius = '50%';
  star.style.width = Math.random() * 2.2 + 'px';
  star.style.height = star.style.width;
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.opacity = Math.random() * 0.7 + 0.2;
  star.style.animation = `twinkle ${Math.random()*3.5+2}s ease-in-out infinite alternate`;
  starBox.appendChild(star);
}

const colorList = [
  '#ff4466','#ff69b4','#ff88aa','#4cd964',
  '#5ac8fa','#ffcc00','#ff9500','#a855f7',
  '#ec4899','#22d3ee','#f472b6','#fb7185'
];
document.body.addEventListener('click', function(e) {
  if(!document.getElementById('page1').classList.contains('hide')) return;
  let heart = document.createElement('div');
  heart.innerText = '❤';
  heart.style.position = 'absolute';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  let randomColor = colorList[Math.floor(Math.random() * colorList.length)];
  heart.style.color = randomColor;
  heart.style.fontSize = '26px';
  heart.style.pointerEvents = 'none';
  heart.style.animation = 'heartScale 1.4s ease-out forwards';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1400);
});

let clickCount = 0;
const perRound = 3;
let stage = 0;
const egg = document.getElementById('egg');
const tipTxt = document.getElementById('tipTxt');
const page1 = document.getElementById('page1');
let smashed = false;

const textArr = [
  "点击敲碎",
  "就这？",
  "没吃饭吗？"
];

egg.onclick = function(){
  if(smashed) return;
  clickCount++;

  if(clickCount >= perRound){
    clickCount = 0;
    stage++;

    if(stage < 3){
      tipTxt.innerText = textArr[stage];
      egg.style.transform = 'rotate(4deg) scale(0.97)';
      setTimeout(()=>egg.style.transform='',150);
    }else{
      smashed = true;
      smashEgg();
    }
  }else{
    egg.style.transform = 'rotate(2deg) scale(0.98)';
    setTimeout(()=>egg.style.transform='',100);
  }
};

function smashEgg(){
  for(let i=0;i<12;i++){
    let f = document.createElement('div');
    f.className = 'fragment';
    let size = Math.floor(Math.random()*20)+15;
    f.style.width = size+'px';
    f.style.height = size+'px';
    egg.appendChild(f);
    let angle = Math.random() * Math.PI * 2;
    let dist = 80 + Math.random()*60;
    f.style.left = 60 + Math.cos(angle)*dist + 'px';
    f.style.top = 80 + Math.sin(angle)*dist + 'px';
    f.style.transition = 'all 1.2s ease-out';
    setTimeout(()=>{
      f.style.opacity = 0;
      f.style.transform = `translateY(${80+Math.random()*100}px) rotate(${Math.random()*360}deg)`;
    },20);
  }

  setTimeout(()=>{
    egg.style.background = 'transparent';
    egg.innerHTML = '';
  },500);

  setTimeout(()=>{
    page1.classList.add('hide');
  },1500);
}
</script>

</body>
</html>
