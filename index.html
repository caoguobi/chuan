<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #080b1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #starBox {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .welcome {
            position: relative;
            z-index: 1;
            font-size: clamp(50px, 20vw, 110px);
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(135, 206, 235, 0.6),
                        0 0 20px rgba(135, 206, 235, 0.4),
                        0 0 30px rgba(64, 136, 235, 0.3);
            animation: softBreath 3.2s ease-in-out infinite alternate;
        }

        @keyframes softBreath {
            0% {
                opacity: 0.8;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* 爱心从小变大 + 上浮淡出 */
        @keyframes heartScale {
            0% {
                transform: translateY(0) scale(0.2);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.8);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="starBox"></div>
    <div class="welcome">dwy</div>

    <script>
        // 生成背景星星
        const starBox = document.getElementById('starBox');
        const starCount = 180;

        for(let i = 0; i < starCount; i++){
            let star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.background = '#fff';
            star.style.borderRadius = '50%';
            star.style.width = Math.random() * 2.2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.opacity = Math.random() * 0.7 + 0.2;
            star.style.animation = `twinkle ${Math.random()*3.5+2}s ease-in-out infinite alternate`;
            starBox.appendChild(star);
        }

        // 星星闪烁动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes twinkle {
                0% {opacity: 0.2;}
                100% {opacity: 0.85;}
            }
        `;
        document.head.appendChild(style);

        // 好看的爱心配色库
        const colorList = [
            '#ff4466',
            '#ff69b4',
            '#ff88aa',
            '#4cd964',
            '#5ac8fa',
            '#ffcc00',
            '#ff9500',
            '#a855f7',
            '#ec4899',
            '#22d3ee',
            '#f472b6',
            '#fb7185'
        ];

        // 点击生成随机颜色爱心
        document.body.addEventListener('click', function(e) {
            let heart = document.createElement('div');
            heart.innerText = '❤';
            heart.style.position = 'absolute';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            // 随机选一个颜色
            let randomColor = colorList[Math.floor(Math.random() * colorList.length)];
            heart.style.color = randomColor;
            heart.style.fontSize = '26px';
            heart.style.pointerEvents = 'none';
            heart.style.animation = 'heartScale 1.4s ease-out forwards';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 1400);
        });
    </script>
</body>
</html>
